<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="sky" x1="960" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ECBF5"/>
      <stop offset="1" stop-color="#BDEEFF"/>
    </linearGradient>
    <linearGradient id="grass" x1="960" y1="680" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ED957"/>
      <stop offset="1" stop-color="#5BAE3E"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="280" cy="160" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFBE0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFBE0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky -->
  <rect width="1920" height="720" fill="url(#sky)"/>
  <!-- Grass -->
  <rect y="680" width="1920" height="400" fill="url(#grass)"/>
  <!-- Grass hills -->
  <ellipse cx="320" cy="700" rx="300" ry="80" fill="#8ADB66"/>
  <ellipse cx="800" cy="720" rx="350" ry="70" fill="#76D452"/>
  <ellipse cx="1350" cy="710" rx="400" ry="90" fill="#82D85C"/>
  <ellipse cx="1750" cy="730" rx="280" ry="60" fill="#6DCF48"/>
  <!-- Sun glow -->
  <circle cx="280" cy="160" r="200" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="280" cy="160" r="70" fill="#FFE566"/>
  <circle cx="280" cy="160" r="56" fill="#FFEF99"/>
  <!-- Clouds -->
  <g opacity="0.7">
    <ellipse cx="500" cy="140" rx="100" ry="36" fill="white"/>
    <ellipse cx="550" cy="150" rx="70" ry="30" fill="white"/>
    <ellipse cx="460" cy="148" rx="60" ry="28" fill="white"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="1200" cy="100" rx="120" ry="40" fill="white"/>
    <ellipse cx="1260" cy="110" rx="80" ry="32" fill="white"/>
    <ellipse cx="1150" cy="108" rx="70" ry="30" fill="white"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="1600" cy="180" rx="90" ry="32" fill="white"/>
    <ellipse cx="1650" cy="188" rx="60" ry="26" fill="white"/>
  </g>
  <!-- Far bushes -->
  <ellipse cx="200" cy="700" rx="100" ry="50" fill="#5CB83E"/>
  <ellipse cx="600" cy="690" rx="80" ry="40" fill="#4DAE32"/>
  <ellipse cx="1050" cy="700" rx="90" ry="45" fill="#52B438"/>
  <ellipse cx="1500" cy="695" rx="110" ry="48" fill="#5CB83E"/>
  <ellipse cx="1800" cy="705" rx="85" ry="42" fill="#4DAE32"/>
  <!-- Dirt path -->
  <path d="M0 850 Q480 790 960 850 Q1440 910 1920 850 V1080 H0Z" fill="#C4944A" opacity="0.3"/>
  <path d="M0 870 Q480 820 960 870 Q1440 920 1920 870 V1080 H0Z" fill="#B8863C" opacity="0.2"/>
  <!-- Small flowers on grass -->
  <circle cx="150" cy="820" r="8" fill="#FF6B8A"/>
  <circle cx="150" cy="820" r="3" fill="#FFE566"/>
  <circle cx="400" cy="780" r="7" fill="#FF9F43"/>
  <circle cx="400" cy="780" r="3" fill="#FFEF99"/>
  <circle cx="700" cy="810" r="8" fill="#FF6B8A"/>
  <circle cx="700" cy="810" r="3" fill="#FFE566"/>
  <circle cx="1100" cy="790" r="7" fill="#A78BFA"/>
  <circle cx="1100" cy="790" r="3" fill="#FFEF99"/>
  <circle cx="1400" cy="815" r="8" fill="#FF9F43"/>
  <circle cx="1400" cy="815" r="3" fill="#FFE566"/>
  <circle cx="1700" cy="800" r="7" fill="#FF6B8A"/>
  <circle cx="1700" cy="800" r="3" fill="#FFEF99"/>
